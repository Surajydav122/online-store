<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Register - Online Store</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <form
            th:action="@{/register}"
            th:object="${user}"
            method="post">

        <input
                type="text"
                th:field="*{name}"
                placeholder="Name"
                required
        >

        <input
                type="email"
                th:field="*{email}"
                placeholder="Email"
                required
        >

        <input
                type="password"
                th:field="*{password}"
                placeholder="Password"
                required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already registered?
        <a href="/login">Login</a>
    </p>

</div>

</body>
</html>
